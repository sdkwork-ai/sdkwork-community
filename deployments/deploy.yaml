version: 2
defaultProfile: standalone.production
profiles:
  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
    expose:
      - tls: sdkwork.com
        mode: web
        web: adaptive
        domain: community.sdkwork.com
      - tls: birdcoder.com
        mode: web
        web: adaptive
        domain: community.birdcoder.com
      - tls: dtupay.com
        mode: web
        web: adaptive
        domain: community.dtupay.com
      - tls: sdkwork.cn
        mode: web
        web: adaptive
        domain: community.sdkwork.cn
      - tls: birdcoder.cn
        mode: web
        web: adaptive
        domain: community.birdcoder.cn
      - tls: dtupay.cn
        mode: web
        web: adaptive
        domain: community.dtupay.cn
