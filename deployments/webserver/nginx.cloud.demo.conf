# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/community/webserver.pid;
error_log /var/log/sdkwork/community/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name community-demo.sdkwork.com community-demo.birdcoder.com community-demo.dtupay.com community-demo.noaper.com community-demo.sdkwork.cn community-demo.birdcoder.cn community-demo.dtupay.cn community-demo.noaper.cn community-demo.skubc.com community-demo.skubc.cn community-demo.zowalk.com community-demo.zowalk.cn community-demo.offer86.com community-demo.offer86.cn community-demo.86offer.com community-demo.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
