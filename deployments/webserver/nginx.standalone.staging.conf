# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/community/webserver.pid;
error_log /var/log/sdkwork/community/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name community-staging.sdkwork.com community-staging.birdcoder.com community-staging.dtupay.com community-staging.noaper.com community-staging.sdkwork.cn community-staging.birdcoder.cn community-staging.dtupay.cn community-staging.noaper.cn community-staging.skubc.com community-staging.skubc.cn community-staging.zowalk.com community-staging.zowalk.cn community-staging.offer86.com community-staging.offer86.cn community-staging.86offer.com community-staging.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
