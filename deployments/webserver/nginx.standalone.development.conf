# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/community/webserver.pid;
error_log /var/log/sdkwork/community/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name community-dev.sdkwork.com community-dev.birdcoder.com community-dev.dtupay.com community-dev.noaper.com community-dev.sdkwork.cn community-dev.birdcoder.cn community-dev.dtupay.cn community-dev.noaper.cn community-dev.skubc.com community-dev.skubc.cn community-dev.zowalk.com community-dev.zowalk.cn community-dev.offer86.com community-dev.offer86.cn community-dev.86offer.com community-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
