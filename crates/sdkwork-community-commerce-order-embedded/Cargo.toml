[package]
name = "sdkwork-community-commerce-order-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
sdkwork-community-service.workspace = true
sdkwork-database-sqlx.workspace = true
# Order is the dependency application; this consumer-side L4 adapter
# composes its public repository surface in-process (embedded same-process
# deployment) instead of the generated SDK HTTP client.
sdkwork-order-repository-sqlx = { path = "../../../sdkwork-order/crates/sdkwork-order-repository-sqlx" }
sdkwork-order-service = { path = "../../../sdkwork-order/crates/sdkwork-order-service" }
